name: blake3_ffi
# Literal `|-`, one line: pub.dev renders this verbatim, and a folded `>-`
# block joins its lines with a space, which is how "One-\nshot" reached pub.dev
# as "One- shot" once. Keeping it unwrapped removes the hazard rather than
# asking the next edit to remember it. The screenshot caption below is literal
# for the same reason.
description: |-
  BLAKE3 hashing for Dart over native FFI: 22x the throughput of the pure-Dart path on bulk data. One-shot, streaming, keyed (MAC), key derivation. C compiled at build.
version: 1.2.1
repository: https://github.com/Yusufihsangorgel/blake3_ffi
issue_tracker: https://github.com/Yusufihsangorgel/blake3_ffi/issues

topics:
  - blake3
  - hashing
  - cryptography
  - ffi
  - performance

screenshots:
  # Numbers come from doc/benchmark.json via bench/bench.dart, and
  # test/published_numbers_test.dart fails if they drift from it.
  - description: |-
      Hashing throughput at 16 MiB on an Apple M4 Pro: 2226 MB/s, against 100 for blake3_dart 1.0.0 (pure Dart) and 167 for SHA-256 from crypto 3.0.7.
    path: doc/benchmark.png

environment:
  sdk: ^3.10.0

# Overrides pub.dev's static-analysis-derived platform tags. Without this,
# pana infers android/ios support from the transitive import graph alone,
# which cannot see that hook/build.dart has never been exercised on either
# platform (no CI job, no test run) and that Flutter's build-hooks/
# native-assets support isn't stable yet. Only list what's actually
# verified: CI (.github/workflows/ci.yaml) covers linux/macos/windows, and
# hook/build.dart's own CBuilder invocation has only ever run there.
# Add android/ios back here once Flutter build-hooks are stable AND this
# package has a real, tested build for them.
platforms:
  linux:
  macos:
  windows:

dependencies:
  # Only for the `Hash` view in lib/src/crypto_hash.dart. Pure Dart, and
  # already in most dependency trees.
  crypto: ^3.0.0
  code_assets: ^1.2.1
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

dev_dependencies:
  # Benchmark baseline only (bench/bench.dart): the pure-Dart BLAKE3 the
  # README compares against. Pinned exactly so a published throughput number
  # always names the build it came from.
  blake3_dart: 1.0.0
  lints: ^6.0.0
  test: ^1.25.0
